# Instalador (NSIS, por usuario) y portable (.zip) de JWPLC Sim para Windows,
# con el package fijado, las dependencias de terceros y el toolchain GCC
# incluidos (la app compila sin red). A pedido y con cada tag v*; con un tag
# además publica una GitHub Release (pre-release) con los dos archivos.
name: Instalador y portable (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  dist:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Caché del package, terceros y toolchain
        uses: actions/cache@v4
        with:
          path: .jwsim
          key: jwsim-${{ runner.os }}-${{ hashFiles('package.lock', 'third_party/sources.json', 'third_party/toolchain.json') }}

      - name: Instalador y portable
        run: node scripts/dist.mjs

      - name: Instalador
        uses: actions/upload-artifact@v4
        with:
          name: JWPLC-Sim-instalador
          path: build/dist/*-instalador.exe
          compression-level: 0

      - name: Portable
        uses: actions/upload-artifact@v4
        with:
          name: JWPLC-Sim-portable
          path: build/dist/*-portable.zip
          compression-level: 0

      - name: Publicar Release del tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          pkg=$(grep '^JWPLC_PACKAGE_REF=' package.lock | cut -d= -f2)
          printf 'JWPLC Sim %s para Windows x64.\n\n- `*-instalador.exe`: instalador por usuario (sin administrador).\n- `*-portable.zip`: la misma app en una carpeta.\n\nIncluye el package JWPLC `%s`, las dependencias de terceros y el toolchain GCC: compila sin red ni Node.js.\nNo tiene firma de código: si Windows SmartScreen avisa, **Más información → Ejecutar de todas formas**.\n' "$tag" "$pkg" > notes.md
          gh release create "$tag" build/dist/*-instalador.exe build/dist/*-portable.zip \
            --repo "$GITHUB_REPOSITORY" --title "JWPLC Sim $tag" --notes-file notes.md --prerelease
