# Diagnósticos en Windows con el toolchain incluido (caídas bajo gdb,
# header precompilado...). Solo a pedido.
name: Diagnóstico en Windows

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script de diagnóstico (scripts/diag-*.mjs)"
        type: string
        default: diag-windows-crash.mjs

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Caché del package, terceros y toolchain
        uses: actions/cache@v4
        with:
          path: .jwsim
          key: jwsim-${{ hashFiles('package.lock', 'third_party/sources.json', 'third_party/toolchain.json') }}

      - name: Package y toolchain fijados
        run: |
          node scripts/fetch-package.mjs
          node scripts/fetch-toolchain.mjs

      - name: Diagnóstico
        run: node scripts/${{ inputs.script }}
