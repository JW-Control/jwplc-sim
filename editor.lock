# Versión del OpenPLC Editor (JWPLC Edition) cuya cadena de compilación usa el
# simulador para los proyectos OpenPLC (G6). ÚNICO lugar donde se fija. Del
# editor salen también, sin copias:
#   - STruC++ en la versión de su binary-versions.json (desde 4.3 el editor
#     pasa a ST con su transpilador JSON; ya no usa xml2st);
#   - el VPP del JWPLC Basic en el commit de platform-jwplc que fija su
#     workflow de pre-release (PLATFORM_VPP_SHA).
# Para cambiar de versión: REF y COMMIT, y `node scripts/fetch-editor.mjs`.
OPENPLC_EDITOR_REPO=https://github.com/JW-Control/openplc-editor.git
# 4.3.3-jwplc.1 (upstream OpenPLC Editor 4.3.3), publicado con 2.1.0-alpha.17.
OPENPLC_EDITOR_REF=jwplc-editor-v4.3.3-jwplc.1
OPENPLC_EDITOR_COMMIT=2bf0b0cae472e92bb8da272fd30ad4fecb391744
# SHA-256 de lo que se descarga del editor (STruC++ v0.7.0 de binary-versions.json).
STRUCPP_SHA256=8d78ae92d931b87c06145520222d1491206f424c147ec66ea84653cb8b0e1be5
