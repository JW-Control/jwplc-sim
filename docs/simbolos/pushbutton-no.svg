<!-- Ejemplo del contrato de docs/SIMBOLOS.md: pulsador NA (jwsim/pushbutton-no).
     Copiar a app/renderer/assets/devices/pushbutton-no.svg para usarlo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 120">
  <!-- Cuerpo: frente del pulsador de 22 mm sobre el bloque de contactos. -->
  <rect x="1" y="1" width="78" height="118" rx="6" fill="#e4e7eb" stroke="#1b1e22" stroke-width="1.6"/>
  <rect x="2" y="30" width="76" height="60" fill="#2f3339"/>
  <!-- Bornes 13 (arriba) y 14 (abajo): boca de la bornera, tornillo y rótulo. -->
  <rect x="34" y="1" width="12" height="4" fill="#1b1e22" opacity="0.75"/>
  <circle cx="40" cy="15" r="10" fill="#cfd4da" stroke="#1b1e22"/>
  <circle cx="40" cy="15" r="8" fill="#f4f5f7" stroke="#1b1e22" stroke-width="1.4"/>
  <path d="M35.6 15H44.4M40 10.6V19.4" stroke="#1b1e22" stroke-width="2.2" stroke-linecap="round"/>
  <text x="58" y="18" font-family="sans-serif" font-size="9" font-weight="700" fill="#1b1e22">13</text>
  <circle class="jw-term" data-term="13" cx="40" cy="15" r="10"/>
  <rect x="34" y="115" width="12" height="4" fill="#1b1e22" opacity="0.75"/>
  <circle cx="40" cy="105" r="10" fill="#cfd4da" stroke="#1b1e22"/>
  <circle cx="40" cy="105" r="8" fill="#f4f5f7" stroke="#1b1e22" stroke-width="1.4"/>
  <path d="M35.6 105H44.4M40 100.6V109.4" stroke="#1b1e22" stroke-width="2.2" stroke-linecap="round"/>
  <text x="58" y="108" font-family="sans-serif" font-size="9" font-weight="700" fill="#1b1e22">14</text>
  <circle class="jw-term" data-term="14" cx="40" cy="105" r="10"/>
  <!-- Aro cromado y cabeza del color del parámetro; hundida al pulsar. -->
  <g data-action="press" data-kind="momentary">
    <circle cx="40" cy="60" r="21" fill="#9aa1aa" stroke="#1b1e22" stroke-width="1.2"/>
    <circle cx="40" cy="60" r="18" fill="#2b2f35"/>
    <g data-show="!out.pressed">
      <circle data-fill="param.color" cx="40" cy="60" r="15" stroke="#1b1e22"/>
      <ellipse cx="35" cy="54" rx="6" ry="3.5" fill="#fff" opacity="0.4"/>
    </g>
    <g data-show="out.pressed">
      <circle data-fill="param.color" cx="40" cy="61" r="13" stroke="#1b1e22" opacity="0.85"/>
      <ellipse cx="36" cy="57" rx="5" ry="2.5" fill="#fff" opacity="0.18"/>
    </g>
  </g>
  <text x="40" y="86" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="700" fill="#e6e8eb">NA</text>
</svg>
