<?xml version="1.0" encoding="UTF-8"?>
<!-- Unidad de mantenimiento: filtro-regulador con manómetro (genérico, G 1/4). Sin bornes eléctricos. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 400" data-terms="none">
<defs>
<linearGradient id="fru-body" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8f969e"/><stop offset=".45" stop-color="#e3e6ea"/><stop offset="1" stop-color="#7d848c"/></linearGradient>
<linearGradient id="fru-bowl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fc3e0" stop-opacity=".55"/><stop offset=".5" stop-color="#e9f3fb" stop-opacity=".7"/><stop offset="1" stop-color="#7fa7c9" stop-opacity=".55"/></linearGradient>
</defs>
<g transform="scale(2)">
<!-- Tubo de entrada y salida -->
<rect x="0" y="92" width="140" height="12" fill="#3d7fe0" opacity=".85"/>
<!-- Perilla de regulación -->
<rect x="54" y="8" width="32" height="22" rx="5" fill="#2b2f35" stroke="#16181b"/>
<g stroke="#4b525a" stroke-width="2"><line x1="60" y1="10" x2="60" y2="28"/><line x1="66" y1="10" x2="66" y2="28"/><line x1="72" y1="10" x2="72" y2="28"/><line x1="78" y1="10" x2="78" y2="28"/></g>
<!-- Cuerpo y manómetro -->
<rect x="44" y="30" width="52" height="86" rx="6" fill="url(#fru-body)" stroke="#3c4249" stroke-width="1.4"/>
<circle cx="70" cy="62" r="20" fill="#f4f6f8" stroke="#2b2f35" stroke-width="2.5"/>
<path d="M56 75 A17 17 0 1 1 84 75" fill="none" stroke="#3ddc6a" stroke-width="3" opacity=".7"/>
<g data-rotate="out.pressure|param.setpoint:0:10:-130:130:70:62"><line x1="70" y1="62" x2="70" y2="47" stroke="#d63031" stroke-width="2.2" stroke-linecap="round"/></g>
<circle cx="70" cy="62" r="2.6" fill="#16181b"/>
<text x="70" y="76" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="700" fill="#59606a">bar</text>
<!-- Vaso del filtro con su purga -->
<path d="M50 116 h40 l-4 52 q-16 8 -32 0 z" fill="url(#fru-bowl)" stroke="#3c4249" stroke-width="1.3"/>
<path d="M54 160 q16 6 32 0 l-1 6 q-15 6 -30 0 z" fill="#5aa0d8" opacity=".6"/>
<rect x="64" y="172" width="12" height="10" rx="2" fill="#2b2f35"/>
<!-- Lectura -->
<rect x="20" y="184" width="100" height="16" rx="3" fill="#101317"/>
<text x="70" y="196" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#7fe3a8" data-text="out.pressure|param.setpoint:d1:bar">— bar</text>
</g>
</svg>
