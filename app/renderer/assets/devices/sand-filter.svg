<?xml version="1.0" encoding="UTF-8"?>
<!-- Filtro de arena a presión con retrolavado: lecho de grava, arena y antracita que se oscurece al colmatarse, manómetro de presión diferencial y perilla de turbidez del agua cruda. Sin bornes: se enlaza por sus parámetros. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" data-terms="none">
<defs>
<linearGradient id="sf-shell" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1f56c8"/><stop offset=".45" stop-color="#5b93ea"/><stop offset="1" stop-color="#1a4bb0"/></linearGradient>
<linearGradient id="sf-knob" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4a4f56"/><stop offset=".5" stop-color="#25282c"/><stop offset="1" stop-color="#121315"/></linearGradient>
</defs>
<rect x="6" y="6" width="308" height="408" rx="14" fill="#1d2126" stroke="#3a4048" stroke-width="2"/>
<text x="160" y="28" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="900" fill="#e7ebef">FILTRO DE ARENA</text>
<rect x="60" y="44" width="120" height="250" rx="54" fill="url(#sf-shell)" stroke="#123a8a" stroke-width="2"/>
<rect x="74" y="80" width="92" height="200" rx="40" fill="#cfe6ff" opacity=".35"/>
<rect x="74" y="236" width="92" height="40" rx="10" fill="#7f8790"/>
<rect x="74" y="176" width="92" height="60" fill="#e2c98f"/>
<rect x="74" y="146" width="92" height="30" fill="#3a3e44"/>
<g data-show="out.colmatacion>50"><rect x="74" y="146" width="92" height="40" fill="#6b4a1e" opacity=".55"/></g>
<g data-show="out.colmatacion>80"><rect x="74" y="146" width="92" height="70" fill="#4a3210" opacity=".6"/></g>
<g data-show="out.lavando"><rect x="74" y="90" width="92" height="56" fill="#9a7a4a" opacity=".6"/><path d="M90 140v-40m30 40v-44m30 44v-40" stroke="#fff" stroke-width="3" stroke-dasharray="6 6" opacity=".8"/></g>
<rect x="100" y="294" width="40" height="40" fill="#5b6470"/>
<path d="M120 40V24h40" stroke="#1f56c8" stroke-width="6" fill="none"/>
<path d="M120 334v20h-50" stroke="#1f56c8" stroke-width="6" fill="none"/>
<text x="30" y="360" font-family="sans-serif" font-size="10" font-weight="800" fill="#9aa3ad">Y2 desagüe</text>
<path d="M140 334v20h44" stroke="#1f56c8" stroke-width="6" fill="none"/>
<text x="190" y="358" font-family="sans-serif" font-size="10" font-weight="800" fill="#9aa3ad">Y1 → T2</text>
<g data-show="out.lavando"><text x="120" y="212" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#ffb020">RETROLAVADO</text></g>
<!-- Manómetro diferencial -->
<circle cx="250" cy="96" r="44" fill="#2a2e33"/><circle cx="250" cy="96" r="38" fill="#f4f5f6"/>
<path d="M223.1 122.9a38 38 0 0 1 -9.1 -15" stroke="#d8282d" stroke-width="6" fill="none" transform="rotate(170 250 96)"/>
<text x="250" y="124" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#5b6470">ΔP bar</text>
<g data-rotate="out.dp|param.colmatacion0:0:2:-135:135:250:96"><path d="M248 96L250 64L252 96Z" fill="#d8282d"/></g>
<circle cx="250" cy="96" r="4" fill="#2a2e33"/>
<text x="250" y="160" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#8fe3ff" data-text="out.dp:d2:bar">0,00 bar</text>
<text x="250" y="182" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="700" fill="#9aa3ad">colmatación</text>
<text x="250" y="200" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#e7ebef" data-text="out.colmatacion|param.colmatacion0:d0:%">40 %</text>
<!-- Turbidez del agua cruda (se arrastra) y botón Colmatar -->
<text x="250" y="230" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="900" fill="#9aa3ad">TURBIDEZ</text>
<g data-action="turbidez" data-kind="drag" data-drag="y:0:-0.6:0:200">
<circle cx="250" cy="270" r="34" fill="#000" opacity="0"/>
<g data-rotate="out.turbidez|param.turbidez:0:200:-135:135:250:270">
<circle cx="250" cy="270" r="26" fill="url(#sf-knob)" stroke="#16181b"/><rect x="248" y="246" width="4" height="12" rx="1.5" fill="#e2c98f"/>
</g></g>
<text x="250" y="314" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#e7ebef" data-text="out.turbidez|param.turbidez:d0:NTU">20 NTU</text>
<g data-action="colmatar" data-kind="momentary"><rect x="206" y="372" width="88" height="28" rx="6" fill="#6b4a1e" stroke="#2a1a08"/><text x="250" y="390" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="900" fill="#fff">COLMATAR</text></g>
<text x="60" y="394" font-family="sans-serif" font-size="10" font-weight="700" fill="#9aa3ad">salida</text>
<text x="170" y="394" text-anchor="end" font-family="monospace" font-size="11" font-weight="700" fill="#e7ebef" data-text="out.qServicio:d0:L/min">0 L/min</text>
</svg>
