<linearGradient id="cal-hol" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9a91a"/><stop offset=".15" stop-color="#f2c230"/><stop offset=".85" stop-color="#f0bf2b"/><stop offset="1" stop-color="#c99a14"/></linearGradient>
