<?xml version="1.0" encoding="UTF-8"?>
<!-- Cable USB del puerto USB-C del JWPLC a la PC (portátil esquemática con el puerto COM en pantalla). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160">
<defs>
<linearGradient id="usbpc-plug" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a3e44"/><stop offset=".5" stop-color="#6b6f72"/><stop offset="1" stop-color="#2b2f35"/></linearGradient>
<linearGradient id="usbpc-scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c3b5e"/><stop offset="1" stop-color="#0d1f33"/></linearGradient>
</defs>
<!-- conector USB-C (entra el cable desde la placa) -->
<rect x="70" y="4" width="20" height="26" rx="4" fill="url(#usbpc-plug)" stroke="#16181b" stroke-width="1.2"/>
<rect x="74" y="8" width="12" height="5" rx="2" fill="#c9ced5"/>
<circle class="jw-term" data-term="USB" cx="80" cy="16" r="9"/>
<path d="M80 30 C80 48 80 48 80 56" fill="none" stroke="#1b1e22" stroke-width="5" stroke-linecap="round"/>
<!-- portátil -->
<rect x="24" y="56" width="112" height="70" rx="5" fill="#2b2f35" stroke="#16181b" stroke-width="1.6"/>
<rect x="30" y="62" width="100" height="58" rx="2" fill="url(#usbpc-scr)"/>
<text x="80" y="80" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#9cc6f0">PC · puerto COM</text>
<text x="80" y="100" font-family="monospace" font-size="15" font-weight="800" text-anchor="middle" fill="#ffffff" data-text="param.com">COM20</text>
<text x="80" y="114" font-family="sans-serif" font-size="8" text-anchor="middle" fill="#9cc6f0">USB · Monitor serie</text>
<path d="M10 128 H150 L142 142 H18 Z" fill="#c9ced5" stroke="#4a4f56" stroke-width="1.4"/>
<rect x="66" y="130" width="28" height="4" rx="2" fill="#8a9199"/>
</svg>
