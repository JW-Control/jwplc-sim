<?xml version="1.0" encoding="UTF-8"?>
<!-- Bomba dosificadora de diafragma sobre su tanque de hipoclorito: LED de marcha, nivel del tanque y clic en el cabezal para descebarla (falla sin caudal). Bobina 24 VDC en A1-A2. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300">
<defs>
<linearGradient id="cl-tank" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8ecef"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#c9cfd6"/></linearGradient>
<clipPath id="cl-clip"><rect x="46" y="144" width="108" height="128"/></clipPath>
</defs>
<rect x="30" y="16" width="140" height="28" rx="6" fill="#2b2f34" stroke="#16181b"/>
<circle class="jw-term" data-term="A1" cx="80" cy="30" r="11"/>
<circle class="jw-term" data-term="A2" cx="120" cy="30" r="11"/>
<g data-action="falla" data-kind="toggle">
<rect x="46" y="48" width="108" height="70" rx="10" fill="#d8282d" stroke="#7a1010" stroke-width="1.5"/>
<circle cx="78" cy="83" r="20" fill="#f4f5f6" stroke="#7a1010"/>
<text x="78" y="87" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="900" fill="#7a1010">DOSIS</text>
<circle cx="130" cy="70" r="6" fill="#3a4048"/>
<g data-show="out.dosificando"><circle cx="130" cy="70" r="6" fill="#37d67a"/><circle cx="130" cy="70" r="10" fill="#37d67a" opacity=".35"/></g>
<g data-show="out.sinCaudal"><rect x="104" y="88" width="46" height="16" rx="3" fill="#ffb020"/><text x="127" y="100" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="900" fill="#1d2126">AIRE</text></g>
</g>
<rect x="40" y="128" width="120" height="150" rx="10" fill="url(#cl-tank)" stroke="#8a939d" stroke-width="1.5"/>
<g clip-path="url(#cl-clip)"><g data-translate="out.tanque|param.tanque:0:100:y:-128"><rect x="46" y="272" width="108" height="130" fill="#e8f27a" opacity=".55"/></g></g>
<rect x="40" y="128" width="120" height="16" fill="#1d2126"/>
<text x="100" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="900" fill="#3a4048">NaClO</text>
<text x="100" y="220" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#3a4048" data-text="out.tanque|param.tanque:d0:%">80 %</text>
<text x="100" y="294" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#9aa3ad">hipoclorito</text>
</svg>
