<?xml version="1.0" encoding="UTF-8"?>
<!-- Compresor de pistón con tanque horizontal y presostato (genérico, 50 L). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360">
<defs>
<linearGradient id="cmp-tank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2554a"/><stop offset=".45" stop-color="#c0362c"/><stop offset="1" stop-color="#7e1f19"/></linearGradient>
<linearGradient id="cmp-alu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9dde2"/><stop offset=".5" stop-color="#9aa1a9"/><stop offset="1" stop-color="#6c737b"/></linearGradient>
</defs>
<g transform="scale(2)">
<!-- Tanque -->
<rect x="20" y="96" width="220" height="54" rx="27" fill="url(#cmp-tank)" stroke="#4a1410" stroke-width="1.5"/>
<path d="M44 150 l-8 18 h16 z M216 150 l-8 18 h16 z" fill="#2b2f35"/>
<text x="130" y="128" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="800" fill="#fff" opacity=".9">50 L · 8 bar</text>
<!-- Motor -->
<rect x="34" y="52" width="70" height="40" rx="6" fill="#2f62d6" stroke="#18306e" stroke-width="1.4"/>
<g stroke="#18306e" stroke-width="1.2" opacity=".7"><line x1="44" y1="56" x2="44" y2="88"/><line x1="54" y1="56" x2="54" y2="88"/><line x1="64" y1="56" x2="64" y2="88"/><line x1="74" y1="56" x2="74" y2="88"/></g>
<!-- Bomba de pistón con aletas -->
<rect x="112" y="40" width="44" height="52" rx="4" fill="url(#cmp-alu)" stroke="#3c4249" stroke-width="1.3"/>
<g stroke="#4b525a" stroke-width="2"><line x1="114" y1="48" x2="154" y2="48"/><line x1="114" y1="56" x2="154" y2="56"/><line x1="114" y1="64" x2="154" y2="64"/><line x1="114" y1="72" x2="154" y2="72"/></g>
<path d="M156 66 h30 v30" fill="none" stroke="#9aa1a9" stroke-width="5" stroke-linecap="round"/>
<!-- Presostato y manómetro -->
<rect x="186" y="34" width="40" height="30" rx="4" fill="#2b2f35" stroke="#16181b"/>
<circle cx="206" cy="80" r="16" fill="#f4f6f8" stroke="#3c4249" stroke-width="2"/>
<path d="M195 89 A13 13 0 1 1 217 89" fill="none" stroke="#d63031" stroke-width="2" stroke-dasharray="2 2"/>
<g data-rotate="out.pressure|param.start:0:12:-130:130:206:80"><line x1="206" y1="80" x2="206" y2="68" stroke="#16181b" stroke-width="2" stroke-linecap="round"/></g>
<circle cx="206" cy="80" r="2.4" fill="#16181b"/>
<!-- Estado -->
<rect x="112" y="6" width="114" height="22" rx="4" fill="#101317"/>
<text x="169" y="21" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="800" fill="#7fe3a8" data-text="out.pressure:d1:bar">— bar</text>
<circle cx="194" cy="49" r="5" fill="#2a3a2c"/>
<g data-show="out.running"><circle cx="194" cy="49" r="5" fill="#3ddc6a"/></g>
<text x="202" y="52" font-family="sans-serif" font-size="7" font-weight="700" fill="#c9cdd3">ON</text>
<!-- Bornes del motor (alimentación 230 VAC) -->
<rect x="26" y="6" width="68" height="26" rx="3" fill="#3a3f45" stroke="#16181b"/>
<circle cx="40" cy="19" r="7" fill="#c9ced5" stroke="#16181b"/><path d="M36 19h8M40 15v8" stroke="#16181b" stroke-width="1.8"/>
<circle cx="80" cy="19" r="7" fill="#c9ced5" stroke="#16181b"/><path d="M76 19h8M80 15v8" stroke="#16181b" stroke-width="1.8"/>
<text x="60" y="23" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="800" fill="#e8eaed">L · N</text>
</g>
<circle class="jw-term" data-term="L" cx="80" cy="38" r="18"/>
<circle class="jw-term" data-term="N" cx="160" cy="38" r="18"/>
</svg>
