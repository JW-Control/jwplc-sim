# Licencias por ruta (especificación REUSE 3.x). El código fuente lleva
# además encabezados SPDX en cada archivo.
version = 1

[[annotations]]
path = ["docs/**", "README.md", "sim/models/**/MODEL.md", "sim/hal/include-win32/README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 JW Control"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["package.lock", "third_party/sources.json", "third_party/toolchain.json", "sim/core-manifest.json", "sim/package-parity.json", "tests/**", ".gitignore", "REUSE.toml", "app/package.json", "app/package-lock.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 JW Control"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["schema/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 JW Control"
SPDX-License-Identifier = "MIT"

# SDK de dispositivos (G7): MIT, para que los dispositivos de terceros
# puedan tomar el contrato, las plantillas y los ejemplos.
[[annotations]]
path = ["sdk/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 JW Control"
SPDX-License-Identifier = "MIT"

# Índice comunitario (G7): cada paquete lleva su propia licencia en su
# manifiesto; la clave pública de firma y los metadatos van con el proyecto.
[[annotations]]
path = ["index/**", "cli/keys/**", ".gitattributes"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 JW Control"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Símbolos y placa de la escena (G7). El logo de Mean Well incrustado en las
# fuentes es marca de su dueño (docs/LICENSES.md §3.6).
[[annotations]]
path = ["app/renderer/assets/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 JW Control"
SPDX-License-Identifier = "GPL-3.0-or-later"
